# Entrega contínua do backend: todo push na `main` que mexa em `backend/` constrói a imagem,
# aplica as migrations no banco de produção e publica a revisão no Cloud Run.
# O gatilho fica em wjf-games / us-east1 (ver docs/deployment.md).
substitutions:
  _REGION: us-east1
  _SERVICE: api-truco-mineiro
  _REPO: us-east1-docker.pkg.dev/${PROJECT_ID}/truco
  _RUNTIME_SA: truco-backend@${PROJECT_ID}.iam.gserviceaccount.com

steps:
  # 1) Imagem do serviço (o contexto é a pasta backend/, com o domínio já versionado nela).
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --target=runtime
      - -t=${_REPO}/backend:${SHORT_SHA}
      - -t=${_REPO}/backend:latest
      - -f=backend/Dockerfile
      - backend

  # 2) Imagem do job de migração (mesmo Dockerfile, outro estágio).
  - id: build-migrate
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --target=migrate
      - -t=${_REPO}/backend-migrate:${SHORT_SHA}
      - -f=backend/Dockerfile
      - backend

  # 3) Publica as imagens no Artifact Registry ANTES do deploy (a publicação automática do
  #    Cloud Build só acontece no fim do build, tarde demais para o passo de deploy).
  - id: push
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        docker push ${_REPO}/backend:${SHORT_SHA}
        docker push ${_REPO}/backend:latest
        docker push ${_REPO}/backend-migrate:${SHORT_SHA}

  # 4) Migrations + seed estrutural ANTES de trocar o tráfego (as migrations são compatíveis com a
  #    revisão anterior, então a que está no ar continua funcionando enquanto isso).
  - id: migrate
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    secretEnv: [DATABASE_URL]
    args:
      - -c
      - docker run --rm -e DATABASE_URL="$$DATABASE_URL" ${_REPO}/backend-migrate:${SHORT_SHA}

  # 5) Publica a revisão nova (mantém env e segredos já configurados no serviço).
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REPO}/backend:${SHORT_SHA}
      - --region=${_REGION}
      - --service-account=${_RUNTIME_SA}
      - --quiet

availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_ID}/secrets/truco-prod-database-url/versions/latest
      env: DATABASE_URL

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
timeout: 1800s
